name: Release prod version to Docker Hub
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

    steps:
      - name: Copy repository
        uses: actions/checkout@v7

      # The image is tagged with package.json's version, so the release
      # must be of that version: a release from a tree whose version was
      # not raised would otherwise publish under the previous version.
      - name: Check that the release tag is package.json's version
        id: version
        run: |
          version=$(jq -r .version package.json)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$version" ]; then
            echo "::error::The release tag is $GITHUB_REF_NAME, and package.json says $version. Raise the version in package.json and package-lock.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-architecture docker builds
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Installations pull their version's tag, so a published version is
      # never replaced.
      - name: Refuse to replace a published version
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.version.outputs.version }} is published already. Release a new version instead."
            exit 1
          fi

      # The platforms the Node image of the Dockerfile exists for
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
