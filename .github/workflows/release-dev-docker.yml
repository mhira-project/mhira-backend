name: Release dev version to Docker Hub
# A version is published by the release workflow only. Pushing a version
# tag does not move `latest`.
on:
  push:
    branches: [develop]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to check for the dev image
        run: "true"

  # Each platform is built on a runner of its own architecture: under
  # emulation, Node 24's `npm ci` for arm64 never finishes.
  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Copy repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # One tag for both platforms, made of the two images above
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the multi-platform tag
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" \
            "$IMAGE:latest-amd64" "$IMAGE:latest-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
